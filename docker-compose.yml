# Fairway Live — full stack (app + PostgreSQL)
#
# Start everything:
#   docker compose up -d --build
#
# App:  https://your-domain.example (place behind a TLS reverse proxy)
# Stop: docker compose down
# Wipe DB volume: docker compose down -v
#
# GOLF_COURSE_API_KEY is read from the project .env file automatically.

services:
  db:
    image: postgres:16-alpine
    container_name: fairway-live-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting the stack}
      POSTGRES_DB: fairway_live
    volumes:
      - fairway_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fairway_live"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${FAIRWAY_IMAGE:-fairway-live:local}
    container_name: fairway-live-app
    restart: unless-stopped
    ports:
      - "${FAIRWAY_HOST_PORT:-3000}:3000"
    environment:
      # Inside Docker the DB host is the service name "db", not localhost
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/fairway_live?schema=public
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Set NEXT_PUBLIC_APP_URL to the public HTTPS URL}
      # Explicitly pass through the same key from .env (Compose substitution)
      GOLF_COURSE_API_KEY: ${GOLF_COURSE_API_KEY:-}
      # Guest hosting is enabled by default for this app. Set this to false on
      # an internet-facing deployment that requires email-only host access.
      ALLOW_GUEST_HOSTS: ${ALLOW_GUEST_HOSTS:-true}
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  fairway_pg_data:
